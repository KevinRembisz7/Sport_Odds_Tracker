name: Daily Edge Card

on:
  # GitHub sometimes delays or skips scheduled runs, so there are backups. A backup that finds today's card
  # already built only does the free refresh (grading, ESPN lines, vibes) and spends no Odds API credits.
  # Tries every ~2 hours, 7 AM to 7 PM Eastern. The first run that lands each day builds the card (spends
  # credits); every later one only does the free refresh (grading, Kalshi, ESPN lines, vibes).
  schedule:
    - cron: '37 11 * * *'   # 7:37 AM ET
    - cron: '23 13 * * *'   # 9:23 AM ET
    - cron: '47 15 * * *'   # 11:47 AM ET
    - cron: '11 17 * * *'   # 1:11 PM ET
    - cron: '29 19 * * *'   # 3:29 PM ET
    - cron: '53 21 * * *'   # 5:53 PM ET
    - cron: '17 23 * * *'   # 7:17 PM ET
  workflow_dispatch:
    inputs:
      budget:
        description: 'Odds API credits to spend (blank = auto: credits left / days left in month)'
        required: false
      force:
        description: 'Type yes to rebuild with fresh odds even if today''s card exists (spends credits)'
        required: false
  push:
    branches: [main]
    paths: ['parlay-maker/**', '.github/workflows/daily-card.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Pushes only redeploy the UI with the last saved card; schedule/manual runs rebuild it.
      - name: Build today's card
        if: github.event_name != 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}   # optional, free at api-football.com
          DAILY_BUDGET: ${{ inputs.budget || vars.DAILY_BUDGET || 'auto' }}
          # schedule + manual runs skip the paid rebuild if today's card exists (free refresh instead);
          # set the 'force' input on a manual run to rebuild anyway
          FRESH_FLAG: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force != 'yes')) && '--skip-if-fresh' || '' }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning title=No ODDS_API_KEY secret::Publishing the last saved card. Add the secret under Settings → Secrets and variables → Actions to get a fresh card every day."
            exit 0
          fi
          node parlay-maker/scripts/build.js $FRESH_FLAG

      - name: Save card to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "edge-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parlay-maker/data/latest.js parlay-maker/data/history.js
          git diff --cached --quiet || git commit -m "Daily card $(date -u +%F)"
          git push

      # Publishing: if Pages is set to "GitHub Actions" these deploy the site; if Pages is set to
      # "Deploy from a branch" (main / root) GitHub publishes the committed files itself and these can be skipped.
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    continue-on-error: true
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
